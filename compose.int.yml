x-base-php-env : &php-base-env
  APP_SECRET: ${APP_SECRET}
  XDEBUG_MODE: off

services:

  router:
    build:
      context: ./docker/router
    environment:
      - EXAMPLE_UPSTREAM=pwa:3000

  php:
    environment:
      <<: *php-base-env

  cron:
    environment:
      <<: *php-base-env

  search:
    environment:
      # Fixture loads push the base 1g heap past OpenSearch's 85% circuit breaker, silently disabling any running Transform (see SessionTransformProvisioner).
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g

  pwa:
    build:
      target: gally_pwa_int
      args:
        - public_url=https://${SERVER_NAME}/example
