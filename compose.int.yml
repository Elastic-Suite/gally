x-base-php-env : &php-base-env
  APP_SECRET: ${APP_SECRET}
  XDEBUG_MODE: off

services:

  router:
    build:
      context: ./docker/router
    environment:
      - EXAMPLE_UPSTREAM=pwa:3001

  php:
    environment:
      <<: *php-base-env

  cron:
    environment:
      <<: *php-base-env

  pwa:
    build:
      target: gally_pwa_int
      args:
        - public_url=https://${SERVER_NAME}/example
    # The example app calls the API on its public host from the server too (NEXT_PUBLIC_API_URL,
    # set in compose.yml): send that host to the proxy on the Docker host, not to public DNS.
    extra_hosts:
      - ${SERVER_NAME}:host-gateway
    volumes:
      # Demo product images ship with gally-sample-data, installed by composer before `up`.
      - ./api/vendor/gally/gally-sample-data/media/catalog/product:/usr/src/front/pwa/public/media/catalog/product:ro
