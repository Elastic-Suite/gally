x-base-php-env: &php-base-env
  APP_SECRET: ${APP_SECRET}
  XDEBUG_MODE: off

services:
  router:
    build:
      context: ./docker/router
    environment:
      - EXAMPLE_UPSTREAM=pwa:3001

  php:
    environment:
      <<: *php-base-env

  cron:
    environment:
      <<: *php-base-env

  pwa:
    build:
      target: gally_pwa_int
      args:
        - public_url=https://${SERVER_NAME}/example
    environment:
      # Server-side calls from the example app go to the public API URL; skip the certificate check.
      # Applies to every outgoing HTTPS call from this container, the admin's included.
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      # Demo product images ship with gally-sample-data, installed by composer before `up`.
      - ./api/vendor/gally/gally-sample-data/media/catalog/product:/usr/src/front/pwa/public/media/catalog/product:ro
